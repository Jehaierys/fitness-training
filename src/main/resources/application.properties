# Application
spring.application.name=fitness
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties]
#server.port=8081
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



# Security
jwt.secret=${JWT_SECRET}
password.encrypt.pepper=${PASSWORD_PEPPER}
jwt.expiration=1h
app.cors.allowed-origins=http://localhost:8080



# Database
spring.datasource.driver-class-name=org.postgresql.Driver
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.access.default=none
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only

management.health.defaults.enabled=true

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
