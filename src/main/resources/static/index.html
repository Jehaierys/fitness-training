<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SHALOM — Добро пожаловать</title>
    <style>
      /* Простая стилизация — все в одном файле по требованию */
      :root{
        --bg1: #0f172a;
        --bg2: #0b3c5d;
        --accent: #ffd166;
        --muted: #cbd5e1;
      }
      html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
      body{
        display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);
        color:var(--muted);
      }
      .card{
        width:min(980px,92%);
        max-width:980px;
        background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
        border-radius:14px;padding:48px;box-shadow:0 10px 30px rgba(2,6,23,0.6);
        display:flex;gap:32px;align-items:center;backdrop-filter: blur(6px);
      }
      .logo{
        flex:0 0 140px;height:140px;border-radius:12px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,var(--accent),#ff9a8b);font-weight:700;color:#08223a;font-size:28px;
        box-shadow:0 6px 18px rgba(15,23,42,0.6) inset;
      }
      .content h1{margin:0;font-size:56px;line-height:1;color:var(--accent);letter-spacing:2px;text-shadow:0 6px 30px rgba(0,0,0,0.45)}
      .content p{margin:12px 0 0;font-size:16px;color:var(--muted)}
      .actions{margin-top:18px}
      .btn{display:inline-block;padding:10px 18px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--muted);cursor:pointer}
      .btn.primary{background:linear-gradient(90deg,#ffd166,#ff9a8b);color:#08121c;border:none}

      /* subtle floating animation */
      @keyframes floaty {0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
      .logo{animation:floaty 4s ease-in-out infinite}

      /* responsive */
      @media (max-width:720px){
        .card{flex-direction:column;align-items:flex-start;padding:24px}
        .logo{width:100%;height:84px;font-size:28px}
        .content h1{font-size:36px}
      }

      /* small confetti pieces (will be controlled by JS) */
      .confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
      .confetti span{position:absolute;width:10px;height:14px;opacity:0;transform:translateY(-10px) rotate(0deg);}
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <div class="logo">SH</div>
      <div class="content">
        <h1>SHALOM</h1>
        <p>Добро пожаловать! Вы успешно авторизованы и перенаправлены на главную страницу.</p>
        <div class="actions">
          <button class="btn" onclick="location.reload()">Обновить</button>
          <button class="btn primary" id="celebrateBtn">Отпраздновать</button>
        </div>
      </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <script>
      // Небольшая функция конфетти — только в этом файле, никаких внешних зависимостей
      (function(){
        const confettiRoot = document.getElementById('confetti');
        function makePiece(){
          const el = document.createElement('span');
          const size = Math.floor(Math.random()*10)+6;
          el.style.width = size + 'px';
          el.style.height = Math.floor(size*1.2) + 'px';
          el.style.left = Math.random()*100 + '%';
          el.style.background = ['#ffd166','#06d6a0','#118ab2','#ef476f'][Math.floor(Math.random()*4)];
          el.style.opacity = '1';
          const duration = 2000 + Math.random()*1800;
          el.animate([
            {transform: `translateY(-40px) rotate(${Math.random()*360}deg)`, opacity:1},
            {transform: `translateY(${window.innerHeight + 100}px) rotate(${Math.random()*720}deg)`, opacity:0}
          ],{duration: duration, easing:'cubic-bezier(.2,.9,.2,1)'});
          confettiRoot.appendChild(el);
          setTimeout(()=>el.remove(), duration+50);
        }
        function celebrate(times=30){
          for(let i=0;i<times;i++) setTimeout(makePiece, i*60 + Math.random()*300);
        }
        document.getElementById('celebrateBtn').addEventListener('click', ()=>celebrate(60));
        // Автоматически немного конфетти при загрузке
        setTimeout(()=>celebrate(18), 450);
      })();
    </script>
  </body>
</html>
